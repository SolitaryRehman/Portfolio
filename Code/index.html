<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Scroll Fight Animation</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- SCROLL SPACE -->
    <div class="scroll-container">

    <!-- PINNED SECTION -->
    <section class="fight-scene"> 

        <!-- BACKGROUND -->
        <div class="bg"></div>

        <!-- CHARACTERS -->
        <div id="char1" class="character left"></div>
        <div id="char2" class="character right"></div>

        <!-- SPECIAL FIRE -->
        <div id="fire" class="fire"></div>

        <!-- OPTIONAL UI -->
        <div class="title">
        <h1>SCROLL FIGHT</h1>
        <p>Scroll Down To Animate</p>
        </div>

    </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
